name: "Maintlog: bug report"
description: Report a reproducible Maintlog problem.
title: "[Maintlog bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For Maintlog only. Use synthetic input and remove private data.
        Report vulnerabilities privately through the security policy.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, Python, backend, and model details
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Command and minimal synthetic input
      render: text
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include sanitized errors and the affected workflow stage.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private records, credentials, and identifying details.
          required: true
