name: Maintenance Agent CI

# Required checks must not depend on workflow-level path filters.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintlog-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-agent.lock
            requirements-ci.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==83.0.0"
          python -m pip install -r requirements-agent.lock
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Verify agent dependency
        run: python -c "import langgraph; print('LangGraph available')"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Formatting
        run: python -m ruff format --check src tests scripts
      - name: Existing unittest suite with branch coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Coverage reports and gate
        if: always()
        run: |
          python -m coverage xml --fail-under=0 -o artifacts/ci/coverage.xml
          python -m coverage json --fail-under=0 -o artifacts/ci/coverage.json
          python -m coverage html --fail-under=0 -d artifacts/ci/htmlcov
          python -m coverage report --fail-under=75
      - name: Complete-agent replay comparison
        run: >
          maintlog-compare data/demo/comparison_cases.json --backend replay
          --trials 3 --output artifacts/ci-comparison.json
      - name: Assert synthetic replay metrics
        run: >
          python scripts/check_replay_report.py artifacts/ci-comparison.json
          data/demo/comparison_cases.json --trials 3
      - name: Build distributions
        run: python -m build
      - name: Distribution metadata
        run: python -m twine check dist/*
      - name: Fresh base-wheel installation and result assertions
        run: python scripts/check_wheel_install.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintlog-reports-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/ci/
            artifacts/ci-comparison.json
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: maintlog-dist-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: dist/

  security:
    name: Maintenance security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade "pip==26.2.1" "setuptools==83.0.0"
          python -m pip install -r requirements-agent.lock
          python -m pip install -r requirements-ci.txt
          python -m pip install -r requirements-security.txt
          python -m pip check
          python -c "from pathlib import Path; Path('artifacts/security').mkdir(parents=True, exist_ok=True)"
      - name: Scan runtime Python source
        run: >
          python -m bandit -r src --severity-level medium --confidence-level medium
          -f json -o artifacts/security/bandit.json
      - name: Audit installed dependencies
        if: ${{ !cancelled() }}
        run: |
          python -m pip uninstall -y maintlog-intelligence
          python -m pip_audit --strict -f json -o artifacts/security/dependencies.json
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintlog-security
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/security/

  gate:
    name: Maintlog required gate
    needs: [checks, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
    steps:
      - name: Require every validation job to succeed
        shell: bash
        run: |
          test "$CHECKS_RESULT" = success
          test "$SECURITY_RESULT" = success
