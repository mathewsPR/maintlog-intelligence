[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintlog-intelligence"
version = "0.3.0"
description = "Evidence-linked equipment-history review with a bounded local agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
agent = ["langgraph==1.2.12"]

[project.scripts]
maintlog = "maintlog.cli:main"
maintlog-review = "maintlog.review:main"
maintlog-compare = "maintlog.comparison:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["maintlog"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
# Measurement phase: establish the complete-repository baseline first.
fail_under = 0

[tool.coverage.html]
directory = "artifacts/ci/htmlcov"

[tool.coverage.xml]
output = "artifacts/ci/coverage.xml"

[tool.coverage.json]
output = "artifacts/ci/coverage.json"
