[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintlog-intelligence"
version = "0.3.0"
description = "Evidence-linked equipment-history review with a bounded local agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
agent = ["langgraph==1.2.12"]

[project.scripts]
maintlog = "maintlog.cli:main"
maintlog-review = "maintlog.review:main"
maintlog-compare = "maintlog.comparison:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
